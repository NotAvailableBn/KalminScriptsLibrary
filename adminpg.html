<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalmin Hub</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;700&display=swap" rel="stylesheet">
<script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
<style>
:root{--bg:#0a0710;--ink:#fff;--soft:rgba(255,255,255,.68);--acc:#ff4d8d;--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.03);--edge:rgba(255,255,255,.28);--hi:rgba(255,255,255,.55);--sh:rgba(0,0,0,.5);--dot:rgba(255,77,141,.5)}
[data-theme=light]{--bg:#f3eef6;--ink:#1a1022;--soft:rgba(26,16,34,.68);--g1:rgba(255,255,255,.7);--g2:rgba(255,255,255,.25);--edge:rgba(255,255,255,.9);--hi:#fff;--sh:rgba(90,40,120,.22);--dot:rgba(255,77,141,.35)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 20s ease-in-out infinite alternate,morph 13s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-12vmax;background:#ff3d7f}
.b2{width:38vmax;height:38vmax;right:-10vmax;top:20vmax;background:#6a3dff;animation-delay:-6s}
.b3{width:32vmax;height:32vmax;left:25vmax;bottom:-14vmax;background:#ff8a3d;animation-delay:-11s}
[data-theme=light] .blob{opacity:.35}
@keyframes drift{to{transform:translate(7vmax,6vmax) scale(1.15) rotate(25deg)}}
@keyframes morph{0%{border-radius:50%}50%{border-radius:62% 38% 46% 54%/48% 60% 40% 52%}100%{border-radius:40% 60% 58% 42%/56% 44% 56% 44%}}
.glass{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1.5px 1px var(--hi),inset 0 -2px 6px rgba(255,255,255,.08),0 20px 50px var(--sh)}
.glass::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-160%) skewX(-18deg);animation:sweep 8s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-160%) skewX(-18deg)}35%,100%{transform:translateX(450%) skewX(-18deg)}}
nav{position:sticky;top:12px;z-index:20;margin:12px auto 0;width:min(1100px,calc(100% - 24px));padding:10px 18px;display:flex;align-items:center;gap:18px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{color:var(--acc)}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.links a{padding:8px 14px;border-radius:999px;color:var(--soft);font-weight:500;font-size:.95rem;transition:.25s}
.links a:hover,.links a.on{color:var(--ink);background:rgba(255,77,141,.18)}
.ic{background:none;border:1px solid var(--edge);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;transition:.25s}
.ic:hover{transform:rotate(20deg);border-color:var(--acc)}
#burger{display:none}
main{flex:1;width:min(1100px,calc(100% - 24px));margin:24px auto}
.page{animation:pg .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pg{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hero{text-align:center;padding:clamp(50px,10vw,110px) 20px;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:14px 14px}
.hero h1{font-size:clamp(2.6rem,10vw,5.4rem);font-weight:700;letter-spacing:-.03em;line-height:1}
.hero h1 b{color:var(--acc);font-weight:700}
.hero h2{margin-top:14px;font-weight:500;font-size:clamp(1.1rem,3.5vw,1.6rem)}
.hero h2 b{color:var(--acc)}
.btns{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:rgba(255,255,255,.1);color:var(--ink);font:500 1rem Outfit,sans-serif;padding:12px 26px;border-radius:14px;cursor:pointer;transition:.25s;display:inline-block}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 28px rgba(255,77,141,.45)}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.card{padding:26px;transition:transform .3s}.card:hover{transform:translateY(-4px)}
.card .n{font-size:2.6rem;font-weight:700;color:var(--acc)}
.card small{color:var(--soft);font-size:.95rem}
.tag{font-size:.75rem;letter-spacing:.12em;color:var(--acc);font-weight:700;text-transform:uppercase}
h3.t{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;margin:6px 0 18px}
.sec{display:flex;align-items:center;gap:10px;font-weight:500;font-size:1.15rem;margin:26px 0 10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.green{background:#3ddc84;box-shadow:0 0 12px 3px #3ddc84}.dot.yellow{background:#ffc83d;box-shadow:0 0 12px 3px #ffc83d}.dot.red{background:#ff4040;box-shadow:0 0 12px 3px #ff4040}.dot.black{background:#000;box-shadow:0 0 12px 3px #777;border:1px solid #888}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:16px}
.row a{color:var(--acc);font-weight:500}.row a:hover{text-decoration:underline}
.empty{color:var(--soft);padding:10px 4px}
.vid{display:block;margin-top:10px;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#000 center/cover}
.vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;background:rgba(0,0,0,.25)}
pre.code{white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.35);color:#fff;padding:16px;border-radius:14px;margin:14px 0;font-size:.9rem}
.doc{padding:clamp(22px,5vw,44px);white-space:pre-wrap;line-height:1.7;color:var(--soft)}
footer{width:min(1100px,calc(100% - 24px));margin:30px auto 16px;padding:30px clamp(20px,4vw,40px) 20px}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px}
.fc h4{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.fc a{display:block;color:var(--soft);padding:4px 0;font-size:.95rem}.fc a:hover{color:var(--acc)}
.fb{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--edge);margin-top:24px;padding-top:16px;font-size:.8rem;color:var(--soft)}
.fb p{max-width:640px}
select,input,textarea{font:inherit;color:var(--ink);background:rgba(127,127,127,.15);border:1px solid var(--edge);border-radius:10px;padding:9px 12px;width:100%}
select option{color:#000}
.fb select{width:auto}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:var(--bg)}
#gate .glass{padding:34px;text-align:center;max-width:380px;width:100%}
#gate .brand{justify-content:center;font-size:1.6rem;margin-bottom:8px}
#gate p{color:var(--soft);margin-bottom:18px}
#gate .h-captcha{display:flex;justify-content:center;min-height:78px}
.adm label{display:block;font-size:.8rem;color:var(--soft);margin:12px 0 4px}
.adm h4{margin:24px 0 6px;color:var(--acc)}
.ar{display:grid;grid-template-columns:1fr 1.6fr 1fr auto;gap:8px;margin-bottom:8px}
.ar button{background:#ff4040;border:0;color:#fff;border-radius:10px;padding:0 12px;cursor:pointer}
@media(max-width:760px){
 nav{border-radius:26px;flex-wrap:wrap}#burger{display:block;margin-left:auto}
 .links{display:none;width:100%;flex-direction:column;align-items:stretch;margin:0}.links.open{display:flex}
 .ar{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="gate"><div class="glass">
  <div class="brand"><img src="/favicon.png" alt=""><span>Kalmin <b>Hub</b></span></div>
  <p>Please verify you are human to continue.</p>
  <div id="hc" class="h-captcha"></div>
</div></div>

<nav class="glass">
  <a class="brand" href="/" data-l><img src="/favicon.png" alt=""><span>Kalmin <b>Hub</b></span></a>
  <button class="ic" id="burger" aria-label="Menu">☰</button>
  <div class="links" id="links">
    <a href="/" data-l data-k="dash">Dashboard</a>
    <a href="/tutorials" data-l data-k="tut">Tutorial</a>
    <a href="/games" data-l data-k="games">Games</a>
    <a href="/executers" data-l data-k="exec">Executors</a>
    <button class="ic" id="theme" aria-label="Toggle theme">☾</button>
  </div>
</nav>

<main id="app"></main>

<footer class="glass">
  <div class="fc" id="fc"></div>
  <div class="fb">
    <p><span data-k="copy">© 2026 Kalmin. All rights reserved.</span><br><span data-k="disc">Kalmin is not affiliated with, endorsed by, or sponsored by Roblox Corporation. Roblox is a registered trademark of Roblox Corporation.</span></p>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select>
  </div>
</footer>

<script>
(function(){
"use strict";
/* ---------- default config (override with /config.json or the admin page) ---------- */
var DEF={
 hcaptcha:"10000000-ffff-ffff-ffff-000000000000", /* test key: replace with your real hCaptcha site key in /adminpg */
 script:'loadstring(game:HttpGet("https://kalmin.kdns.fr/script.lua"))()',
 lvId:"10419982",
 verifyUrl:"", /* optional: your server endpoint that checks the Linkvertise hash with the anti-bypass token */
 discordInvite:"u5XmnW6Vkq",
 social:{discord:"https://discord.gg/u5XmnW6Vkq",support:"https://discord.gg/XAyxW74BsY",youtube:"https://www.youtube.com/channel/UCj_-Y0AkXIHnr4AiaJV8d9g"},
 games:[
  {n:"Rivals",u:"https://www.roblox.com/discover?Keyword=Rivals",s:"current"},
  {n:"Granny",u:"https://www.roblox.com/discover?Keyword=Granny",s:"current"},
  {n:"Flick",u:"https://www.roblox.com/discover?Keyword=Flick",s:"current"}],
 execs:[
  {n:"Madium (Pc)",s:"green"},{n:"Real (Pc)",s:"green"},{n:"Volt (Pc)",s:"green"},
  {n:"Velocity (Pc)",s:"yellow"},{n:"Bunni (Pc)",s:"yellow"},{n:"Yub-X (Pc)",s:"yellow"},{n:"Lynx (Pc)",s:"yellow"},{n:"Lucid (Pc)",s:"yellow"},{n:"Patassium (Pc)",s:"yellow"},{n:"Xeno (Pc)",s:"yellow"},{n:"Solara (Pc)",s:"yellow"},{n:"Nexomia (Pc)",s:"yellow"},{n:"SirHurt (Pc)",s:"yellow"},{n:"Seliware (Pc)",s:"yellow"},{n:"Delta (Mobile)",s:"yellow"},{n:"Opiumware (Mac)",s:"yellow"}],
 tutorials:[], /* {p:"YouTube",t:"How To Get Key",u:"https://youtube.com/watch?v=ID"} */
 terms:"Terms of Service\n\nEdit this text from /adminpg.",
 privacy:"Privacy Policy\n\nEdit this text from /adminpg.",
 pw:"888e68c26069c0c2476e3ec130084fd2057c2c0f95f061ed82d6bef4371a6bf6" /* SHA-256 of default password: kalmin-admin */
};
var cfg=JSON.parse(JSON.stringify(DEF));
var T={ /* tiny translation table; English is the fallback */
 es:{dash:"Panel",tut:"Tutorial",games:"Juegos",exec:"Ejecutores",copy:"© 2026 Kalmin. Todos los derechos reservados.",disc:"Kalmin no está afiliado, respaldado ni patrocinado por Roblox Corporation. Roblox es una marca registrada de Roblox Corporation.",com:"Comunidad",soc:"Social",leg:"Legal",terms:"Términos de servicio",priv:"Política de privacidad"},
 fr:{dash:"Tableau de bord",tut:"Tutoriel",games:"Jeux",exec:"Exécuteurs",copy:"© 2026 Kalmin. Tous droits réservés.",disc:"Kalmin n'est ni affilié, ni approuvé, ni parrainé par Roblox Corporation. Roblox est une marque déposée de Roblox Corporation.",com:"Communauté",soc:"Social",leg:"Légal",terms:"Conditions d'utilisation",priv:"Politique de confidentialité"},
 de:{dash:"Dashboard",tut:"Anleitung",games:"Spiele",exec:"Executors",copy:"© 2026 Kalmin. Alle Rechte vorbehalten.",disc:"Kalmin steht in keiner Verbindung zur Roblox Corporation. Roblox ist eine eingetragene Marke der Roblox Corporation.",com:"Community",soc:"Soziales",leg:"Rechtliches",terms:"Nutzungsbedingungen",priv:"Datenschutz"},
 pt:{dash:"Painel",tut:"Tutorial",games:"Jogos",exec:"Executores",copy:"© 2026 Kalmin. Todos os direitos reservados.",disc:"A Kalmin não é afiliada, endossada ou patrocinada pela Roblox Corporation. Roblox é marca registrada da Roblox Corporation.",com:"Comunidade",soc:"Social",leg:"Legal",terms:"Termos de Serviço",priv:"Política de Privacidade"}
};
var lang=localStorage.getItem("kl_lang")||"en";
function t(k,d){return (T[lang]&&T[lang][k])||d}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(s){return document.querySelector(s)}
var app=$("#app");

/* ---------- helpers ---------- */
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function merge(a,b){for(var k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=merge(a[k]||{},b[k])}else a[k]=b[k]}return a}
function saveLocal(){localStorage.setItem("kl_cfg",JSON.stringify(cfg))}

/* ---------- theme ---------- */
function setTheme(m){document.documentElement.dataset.theme=m;$("#theme").textContent=m==="dark"?"☾":"☀";localStorage.setItem("kl_theme",m)}
setTheme(localStorage.getItem("kl_theme")||"dark");
$("#theme").onclick=function(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")};
$("#burger").onclick=function(){$("#links").classList.toggle("open")};
$("#lang").value=lang;
$("#lang").onchange=function(){lang=this.value;localStorage.setItem("kl_lang",lang);chrome();route()};

/* ---------- nav + footer text ---------- */
function chrome(){
 document.querySelectorAll("[data-k]").forEach(function(e){if(!e.dataset.d)e.dataset.d=e.textContent;e.textContent=t(e.dataset.k,e.dataset.d)});
 var s=cfg.social;
 $("#fc").innerHTML='<div><h4>'+t("com","Community")+'</h4><a href="'+esc(s.discord)+'" target="_blank" rel="noopener">Discord</a><a href="'+esc(s.support)+'" target="_blank" rel="noopener">Support</a></div>'+
 '<div><h4>'+t("soc","Social")+'</h4><a href="'+esc(s.youtube)+'" target="_blank" rel="noopener">YouTube</a></div>'+
 '<div><h4>'+t("leg","Legal")+'</h4><a href="/terms" data-l>'+t("terms","Terms Of Service")+'</a><a href="/privacy" data-l>'+t("priv","Privacy Policy")+'</a></div>';
}

/* ---------- pages ---------- */
function dash(){
 app.innerHTML='<section class="glass hero"><h1>Kalmin <b>Hub</b></h1><h2>Go Beyond with <b>Kalmin</b>.</h2><div class="btns"><button class="btn p" id="gs">Get Script</button><a class="btn" href="/tutorials" data-l>'+t("tut","Tutorial")+'</a></div></section>'+
 '<div class="grid"><div class="glass card"><div class="n" id="vc">—</div><small>Website visitors</small></div><div class="glass card"><div class="n" id="dc">—</div><small>Discord members</small></div></div>';
 $("#gs").onclick=function(){
  var back=location.origin+"/getscript";
  var rnd=Math.floor(Math.random()*1e5);
  location.href="https://link-to.net/"+encodeURIComponent(cfg.lvId)+"/"+rnd+"/dynamic?r="+btoa(encodeURI(back));
 };
 fetch("https://api.counterapi.dev/v1/kalmin-hub/visits/"+(sessionStorage.kl_v?"":"up")).then(function(r){return r.json()}).then(function(j){sessionStorage.kl_v=1;$("#vc").textContent=(j.count||0).toLocaleString()}).catch(function(){});
 fetch("https://discord.com/api/v9/invites/"+encodeURIComponent(cfg.discordInvite)+"?with_counts=true").then(function(r){return r.json()}).then(function(j){if(j.approximate_member_count)$("#dc").textContent=j.approximate_member_count.toLocaleString()}).catch(function(){});
}
function getscript(){
 var p=new URLSearchParams(location.search),h=p.get("hash"),ok=sessionStorage.kl_ok==="1";
 function show(){sessionStorage.kl_ok="1";app.innerHTML='<section class="glass card"><h3 class="t">Your Script</h3><pre class="code" id="sc">'+esc(cfg.script)+'</pre><button class="btn p" id="cp">Copy Script</button></section>';
  $("#cp").onclick=function(){var b=this;navigator.clipboard.writeText(cfg.script).then(function(){b.textContent="Copied ✓";setTimeout(function(){b.textContent="Copy Script"},1800)})}}
 function deny(m){app.innerHTML='<section class="glass card"><h3 class="t">Checkpoint required</h3><p class="empty">'+m+'</p><a class="btn p" href="/" data-l>Back to Dashboard</a></section>'}
 if(h){
  history.replaceState(null,"","/getscript");
  if(cfg.verifyUrl){fetch(cfg.verifyUrl+"?hash="+encodeURIComponent(h)).then(function(r){return r.json()}).then(function(j){j.valid||j.status===true?show():deny("Verification failed. Please complete the checkpoint again.")}).catch(function(){deny("Could not verify. Try again.")})}
  else show();
 } else if(ok)show(); else deny("Complete the Linkvertise checkpoint from the dashboard to get the script.");
}
function tuts(){
 var h='<h3 class="t">Tutorials</h3>';
 if(!cfg.tutorials.length)h+='<div class="glass card"><p class="empty">No tutorials are currently available.</p></div>';
 else h+='<div class="grid">'+cfg.tutorials.map(function(x){
  var m=String(x.u).match(/(?:v=|youtu\.be\/)([\w-]{11})/),th=m?'style="background-image:url(https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg)"':"";
  return '<div class="glass card"><div class="tag">'+esc(x.p)+'</div><h3 style="font-weight:700;margin-top:6px">'+esc(x.t)+'</h3><a class="vid" '+th+' href="'+esc(x.u)+'" target="_blank" rel="noopener" aria-label="Watch"></a></div>'}).join("")+'</div>';
 app.innerHTML=h;
}
function sec(cls,title,items,fn,empty){return '<div class="sec"><span class="dot '+cls+'"></span>'+title+'</div><div class="list">'+(items.length?items.map(fn).join(""):'<div class="glass row"><span class="empty">'+empty+'</span></div>')+'</div>'}
function games(){
 var g=cfg.games,row=function(x){return '<div class="glass row"><span>'+esc(x.n)+'</span>'+(x.u?'<a href="'+esc(x.u)+'" target="_blank" rel="noopener">View Game</a>':'')+'</div>'};
 app.innerHTML='<h3 class="t">Kalmin Supported Games</h3>'+
  sec("green","Current Supported Games",g.filter(function(x){return x.s==="current"}),row,"[Not Available Yet]")+
  sec("black","To Be Supported Soon Games",g.filter(function(x){return x.s==="soon"}),row,"[Not Available Yet]")+
  sec("red","Retired Games",g.filter(function(x){return x.s==="retired"}),row,"[Not Available Yet]");
}
function execs(){
 var e=cfg.execs,row=function(x){return '<div class="glass row"><span>'+esc(x.n)+'</span></div>'};
 app.innerHTML='<h3 class="t">Kalmin Supported Executors</h3>'+
  sec("green","Supported",e.filter(function(x){return x.s==="green"}),row,"[Not Available Yet]")+
  sec("yellow","Unknown",e.filter(function(x){return x.s==="yellow"}),row,"[Not Available Yet]")+
  sec("red","Not Supported",e.filter(function(x){return x.s==="red"}),row,"[Not Available Yet]");
}
function doc(k,title){app.innerHTML='<h3 class="t">'+title+'</h3><div class="glass doc">'+esc(cfg[k])+'</div>'}

/* ---------- admin ---------- */
function admin(){
 if(sessionStorage.kl_adm!=="1"){
  app.innerHTML='<section class="glass card" style="max-width:380px;margin:40px auto"><h3 class="t">Admin</h3><input type="password" id="pw" placeholder="Password" autocomplete="current-password"><div class="btns"><button class="btn p" id="li">Login</button></div><p class="empty" id="er"></p></section>';
  var go=function(){sha($("#pw").value).then(function(x){if(x===cfg.pw){sessionStorage.kl_adm="1";admin()}else $("#er").textContent="Wrong password."})};
  $("#li").onclick=go;$("#pw").onkeydown=function(e){if(e.key==="Enter")go()};return;
 }
 var F=function(label,path,area){return '<label>'+label+'</label>'+(area?'<textarea rows="6" data-p="'+path+'">':'<input data-p="'+path+'" value="')+esc(get(path))+(area?'</textarea>':'">')};
 var L=function(title,key,fields,opts){return '<h4>'+title+'</h4><div data-list="'+key+'">'+cfg[key].map(function(x,i){return '<div class="ar">'+fields.map(function(f){return f==="s"?'<select data-i="'+i+'" data-f="s">'+opts.map(function(o){return '<option'+(x.s===o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>':'<input data-i="'+i+'" data-f="'+f+'" value="'+esc(x[f])+'">'}).join("")+'<button data-del="'+key+':'+i+'">✕</button></div>'}).join("")+'</div><button class="btn" data-add="'+key+'">+ Add</button>'};
 app.innerHTML='<section class="glass card adm"><h3 class="t">Admin panel</h3>'+
  F("hCaptcha site key","hcaptcha")+F("Script (shown after checkpoint)","script",1)+F("Linkvertise publisher ID","lvId")+F("Verify endpoint (server that checks the anti-bypass token, optional)","verifyUrl")+F("Discord invite code (for member count)","discordInvite")+
  F("Discord link","social.discord")+F("Discord support link","social.support")+F("YouTube link","social.youtube")+
  L("Games (name · link · current/soon/retired)","games",["n","u","s"],["current","soon","retired"])+
  L("Executors (name · green/yellow/red)","execs",["n","s"],["green","yellow","red"])+
  L("Tutorials (platform · title · video link)","tutorials",["p","t","u"])+
  F("Terms of Service","terms",1)+F("Privacy Policy","privacy",1)+
  '<label>New admin password (leave empty to keep)</label><input type="password" id="np">'+
  '<div class="btns"><button class="btn p" id="sv">Save in this browser</button><button class="btn" id="dl">Download config.json</button><button class="btn" id="rs">Reset local copy</button><button class="btn" id="lo">Logout</button></div>'+
  '<p class="empty" id="ms">Visitors only see changes after you upload the downloaded config.json next to index.html.</p></section>';
 var root=app;
 function sync(){root.querySelectorAll("[data-p]").forEach(function(e){set(e.dataset.p,e.value)});root.querySelectorAll("[data-i]").forEach(function(e){var l=e.closest("[data-list]").dataset.list;cfg[l][e.dataset.i][e.dataset.f]=e.value})}
 root.onclick=function(e){var b=e.target;
  if(b.dataset.add){sync();cfg[b.dataset.add].push(b.dataset.add==="games"?{n:"",u:"",s:"current"}:b.dataset.add==="execs"?{n:"",s:"yellow"}:{p:"YouTube",t:"",u:""});admin()}
  if(b.dataset.del){sync();var d=b.dataset.del.split(":");cfg[d[0]].splice(+d[1],1);admin()}};
 $("#sv").onclick=function(){sync();var np=$("#np").value;(np?sha(np).then(function(h){cfg.pw=h}):Promise.resolve()).then(function(){saveLocal();chrome();$("#ms").textContent="Saved in this browser."})};
 $("#dl").onclick=function(){sync();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,1)],{type:"application/json"}));a.download="config.json";a.click()};
 $("#rs").onclick=function(){localStorage.removeItem("kl_cfg");location.reload()};
 $("#lo").onclick=function(){sessionStorage.kl_adm="0";admin()};
}
function get(p){return p.split(".").reduce(function(o,k){return o[k]},cfg)}
function set(p,v){var a=p.split("."),o=cfg;while(a.length>1)o=o[a.shift()];o[a[0]]=v}

/* ---------- router ---------- */
var R={"/":dash,"/tutorials":tuts,"/games":games,"/executers":execs,"/getscript":getscript,"/terms":function(){doc("terms","Terms Of Service")},"/privacy":function(){doc("privacy","Privacy Policy")},"/adminpg":admin};
function route(){
 var p=location.pathname.replace(/\/index\.html$/,"/").replace(/(.)\/$/,"$1");
 var f=R[p]||dash;
 app.className="";void app.offsetWidth;app.className="page";f();
 document.querySelectorAll(".links a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")===p)});
 $("#links").classList.remove("open");window.scrollTo(0,0);
}
document.addEventListener("click",function(e){var a=e.target.closest("a[data-l]");if(a){e.preventDefault();history.pushState(null,"",a.getAttribute("href"));chrome();route()}});
window.addEventListener("popstate",route);

/* ---------- hCaptcha gate ---------- */
function gate(){
 if(sessionStorage.kl_h==="1"){$("#gate").remove();return}
 var n=0,iv=setInterval(function(){
  if(window.hcaptcha){clearInterval(iv);hcaptcha.render("hc",{sitekey:cfg.hcaptcha,theme:document.documentElement.dataset.theme,callback:function(){sessionStorage.kl_h="1";var g=$("#gate");g.style.transition="opacity .6s";g.style.opacity=0;setTimeout(function(){g.remove()},600)}})}
  else if(++n>100){clearInterval(iv);$("#hc").textContent="Could not load hCaptcha. Disable blockers and refresh."}
 },100);
}

/* ---------- boot ---------- */
fetch("/config.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}).then(function(j){
 merge(cfg,j);
 try{var l=JSON.parse(localStorage.getItem("kl_cfg")||"null");if(l)merge(cfg,l)}catch(e){}
 chrome();route();gate();
});
})();
</script>
</body>
